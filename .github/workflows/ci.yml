name: Shellify checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Repository PSGallery -Force -ErrorAction Stop
      - name: Analyze every generated command template
        shell: pwsh
        run: ./tools/analyze-templates.ps1 -OutputDirectory "${{ runner.temp }}/shellify-analysis"
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
